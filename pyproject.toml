[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyams"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8, <4"
authors = [
    {name = "Haozhou Wang", email = "howcanoewang@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Environment :: Plugins",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy==1.26.4",
    "onnx==1.17.0",
    "onnxruntime==1.19.2",
    "opencv-python==4.10.0.84",
    "pillow>=8.2.0",
    "pybboxes==0.1.6",
    "requests==2.32.3",
    "shapely>=2.0.0",
    "stag-python==1.1.0",
    "tqdm>=4.48.2",
]

[dependency-groups]
train = [
    "labelme==5.6.1",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.3.63",
]

[project.urls]
Source = "https://github.com/UTokyo-FieldPhenomics-Lab/EasyAMS"
Tracker = "https://github.com/UTokyo-FieldPhenomics-Lab/EasyAMS/issues"
forum = "https://github.com/UTokyo-FieldPhenomics-Lab/EasyAMS/discussions"
